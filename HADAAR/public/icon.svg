<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C992"/>
      <stop offset="50%" stop-color="#C7A66A"/>
      <stop offset="100%" stop-color="#8C6F3B"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A283B"/>
      <stop offset="100%" stop-color="#111D2D"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- App Icon Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Outer Gold Accent Border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.3"/>
  
  <!-- Graduation Cap (HADAR Symbol) -->
  <g transform="translate(256, 240) scale(1.15)" filter="url(#shadow)">
    <!-- Top Rhombus / Cap -->
    <path d="M 0 -70 L 150 -10 L 0 50 L -150 -10 Z" fill="url(#goldGrad)"/>
    
    <!-- Cap Under Skull Arch -->
    <path d="M -90 12 L 0 55 L 90 12 L 90 45 C 90 85 0 115 0 115 C 0 115 -90 85 -90 45 Z" fill="#27877E" fill-opacity="0.9"/>
    
    <!-- Tassel Button & Cord -->
    <circle cx="0" cy="-10" r="10" fill="#FFFFFF"/>
    <path d="M 0 -10 Q 90 -5 130 50 L 130 110" fill="none" stroke="#E5C992" stroke-width="6" stroke-linecap="round"/>
    <circle cx="130" cy="115" r="9" fill="#C7A66A"/>
  </g>
  
  <!-- Brand Name Arabic / English at bottom -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#C7A66A" text-anchor="middle" letter-spacing="4">HADAR • حَضَر</text>
</svg>
